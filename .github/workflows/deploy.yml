name: Deploy production

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

# A deployment runner must never process two releases at the same time.
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: [self-hosted, linux, arm64, ade-deploy]
    timeout-minutes: 30
    environment:
      name: production

    steps:
      - name: Deploy the validated main commit
        env:
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
        run: sudo -n /usr/local/sbin/ade-control-plane-deploy "$DEPLOY_SHA"
