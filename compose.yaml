name: ade-control-plane

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ade_control_plane}
      POSTGRES_USER: ${POSTGRES_USER:-ade_control_plane}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - control
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  dashboard:
    build:
      context: .
      dockerfile: deploy/Dockerfile
      target: dashboard-runtime
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid,nodev
    environment:
      NODE_ENV: production
      DATABASE_URL_FILE: /run/secrets/database_url
      DASHBOARD_PUBLIC_URL: ${DASHBOARD_PUBLIC_URL:?Set DASHBOARD_PUBLIC_URL in the production environment file}
      DASHBOARD_SESSION_SECRET_FILE: /run/secrets/dashboard_session_secret
      DASHBOARD_PASSWORD_HASH_FILE: /run/secrets/dashboard_password_hash
      DASHBOARD_OPERATOR_REF: ${DASHBOARD_OPERATOR_REF:-operator}
      DASHBOARD_SESSION_TTL_MINUTES: ${DASHBOARD_SESSION_TTL_MINUTES:-720}
      DASHBOARD_REFRESH_SECONDS: ${DASHBOARD_REFRESH_SECONDS:-15}
      QUOTA_PROVIDER: ${QUOTA_PROVIDER:-openai}
      CODEX_CREDENTIAL_REF: ${CODEX_CREDENTIAL_REF:-codex-account-main}
    secrets:
      - database_url
      - dashboard_session_secret
      - dashboard_password_hash
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:${DASHBOARD_BIND_PORT:-3000}:3000"
    networks:
      - control
      - edge
      - proxy
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.routers.ade-control-plane.rule=Host(`${DASHBOARD_PUBLIC_HOST:?Set DASHBOARD_PUBLIC_HOST in the production environment file}`)
      - traefik.http.routers.ade-control-plane.entrypoints=websecure
      - traefik.http.routers.ade-control-plane.tls=true
      - traefik.http.routers.ade-control-plane.tls.certresolver=le
      - traefik.http.routers.ade-control-plane.tls.options=modern@file
      - traefik.http.services.ade-control-plane.loadbalancer.server.port=3000
      - traefik.http.routers.ade-control-plane-http.rule=Host(`${DASHBOARD_PUBLIC_HOST:?Set DASHBOARD_PUBLIC_HOST in the production environment file}`)
      - traefik.http.routers.ade-control-plane-http.entrypoints=web
      - traefik.http.routers.ade-control-plane-http.middlewares=ade-control-plane-redirect
      - traefik.http.middlewares.ade-control-plane-redirect.redirectscheme.scheme=https
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  worker:
    build:
      context: .
      dockerfile: deploy/Dockerfile
      target: worker-runtime
    restart: unless-stopped
    # The initial Raspberry deployment follows the V0 Dashboard task loop.
    # The GitHub-first multi-project worker remains a separate post-V0 entrypoint.
    command: ["node_modules/.bin/tsx", "apps/worker/src/v0/main.ts"]
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=512m,noexec,nosuid,nodev
    environment:
      NODE_ENV: production
      DATABASE_URL_FILE: /run/secrets/database_url
      V0_PROJECT_ROOT: /srv/ade-projects
      CODEX_EXECUTABLE: ${CODEX_EXECUTABLE:-codex}
      CODEX_API_KEY_FILE: /run/secrets/codex_api_key
      CODEX_HOME: /home/ade-worker/.codex
      CODEX_APP_SERVER_URL: ${CODEX_APP_SERVER_URL:-}
      CODEX_CREDENTIAL_REF: ${CODEX_CREDENTIAL_REF:-codex-account-main}
      V0_GIT_HOME: /home/ade-git
      V0_TASK_TIMEOUT_SECONDS: ${V0_TASK_TIMEOUT_SECONDS:-3600}
      V0_WORKER_IDLE_SECONDS: ${V0_WORKER_IDLE_SECONDS:-2}
      DASHBOARD_PUBLIC_URL: ${DASHBOARD_PUBLIC_URL:?Set DASHBOARD_PUBLIC_URL in the production environment file}
      GITHUB_APP_ID: ${GITHUB_APP_ID:?Set GITHUB_APP_ID in the production environment file}
      GITHUB_APP_INSTALLATION_ID: ${GITHUB_APP_INSTALLATION_ID:?Set GITHUB_APP_INSTALLATION_ID in the production environment file}
      GITHUB_APP_PRIVATE_KEY_FILE: /run/secrets/github_app_private_key
      # The host runner owns the socket and host workspaces. The worker gets
      # only this narrow runtime directory and the dedicated HMAC secret.
      RUNNER_SOCKET_PATH: /run/ade-control-plane-runner/runner.sock
      RUNNER_AUTH_SECRET_FILE: /run/secrets/runner_auth_secret
    secrets:
      - database_url
      - codex_api_key
      - github_app_private_key
      - runner_auth_secret
    volumes:
      - ${V0_PROJECTS_HOST:-./data/projects}:/srv/ade-projects:rw
      - ${V0_GIT_HOME_HOST:-./data/git-home}:/home/ade-git:ro
      - codex_home:/home/ade-worker/.codex
      - ${RUNNER_RUNTIME_DIR_HOST:-/run/ade-control-plane-runner}:/run/ade-control-plane-runner:rw
    group_add:
      - "${RUNNER_SOCKET_GID:?Set RUNNER_SOCKET_GID to the host ade-runner group GID}"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - control
      # Outbound-only Docker bridge access is required for Codex and GitHub.
      # No worker port is published and PostgreSQL remains control-only.
      - egress
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "node", "-e", "process.exit(require('node:fs').existsSync('/proc/1/cmdline') ? 0 : 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  postgres_data:
  codex_home:

secrets:
  postgres_password:
    file: ${SECRETS_DIR:-./secrets}/postgres_password
  database_url:
    file: ${SECRETS_DIR:-./secrets}/database_url
  dashboard_session_secret:
    file: ${SECRETS_DIR:-./secrets}/dashboard_session_secret
  dashboard_password_hash:
    file: ${SECRETS_DIR:-./secrets}/dashboard_password_hash
  github_app_private_key:
    file: ${SECRETS_DIR:-./secrets}/github_app_private_key
  codex_api_key:
    file: ${SECRETS_DIR:-./secrets}/codex_api_key
  runner_auth_secret:
    file: ${SECRETS_DIR:-./secrets}/runner_auth_secret

networks:
  control:
    internal: true
  edge:
  proxy:
    external: true
  egress:
